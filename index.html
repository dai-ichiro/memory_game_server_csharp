<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモリーゲーム</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "メイリオ", sans-serif;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { margin-bottom: 12px; font-size: 28px; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .status {
    display: flex;
    gap: 24px;
    margin-bottom: 16px;
    font-size: 18px;
    background: rgba(255,255,255,.12);
    padding: 10px 22px;
    border-radius: 10px;
  }
  .status span { font-weight: bold; }
  #restart {
    padding: 10px 22px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #ff9800;
    color: #fff;
    cursor: pointer;
    margin-bottom: 18px;
    transition: background .2s;
  }
  #restart:hover { background: #f57c00; }
  #board {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 760px;
    aspect-ratio: 6 / 4;
  }
  .card {
    position: relative;
    cursor: pointer;
    perspective: 600px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 3px 6px rgba(0,0,0,.3);
  }
  .card .inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform .5s;
    transform-style: preserve-3d;
  }
  .card.flipped .inner,
  .card.matched .inner { transform: rotateY(180deg); }
  .card .front, .card .back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card .back {
    background: linear-gradient(135deg, #455a64, #607d8b);
    font-size: 32px;
    color: rgba(255,255,255,.5);
  }
  .card .front {
    transform: rotateY(180deg);
    background: #fff;
    padding: 4px;
  }
  .card .front img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card.matched .front {
    outline: 3px solid #66bb6a;
    outline-offset: -3px;
  }
  .card:not(.matched):not(.locked):active { cursor: progress; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 10;
  }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 34px; }
  #overlay p { font-size: 20px; }
</style>
</head>
<body>
  <h1>メモリーゲーム</h1>
  <div class="status">
    <div>ターン: <span id="turns">0</span></div>
    <div>一致: <span id="matches">0 / 12</span></div>
    <div>時間: <span id="time">0:00</span></div>
  </div>
  <button id="restart">新しいゲーム</button>
  <div id="board"></div>

  <div id="overlay">
    <h2>クリア！</h2>
    <p id="result"></p>
    <button id="restart2" style="padding:10px 22px;font-size:16px;border:none;border-radius:8px;background:#ff9800;color:#fff;cursor:pointer;">もう一度遊ぶ</button>
  </div>

<script>
(function () {
  const TOTAL_PAIRS = 12;
  const IMG_DIR = "Images/";
  const API_IMAGES = "/api/images";
  const board = document.getElementById("board");
  const turnsEl = document.getElementById("turns");
  const matchesEl = document.getElementById("matches");
  const timeEl = document.getElementById("time");
  const overlay = document.getElementById("overlay");
  const resultEl = document.getElementById("result");

  let firstCard = null;
  let lockBoard = false;
  let turns = 0;
  let matches = 0;
  let startTime = null;
  let timerId = null;
  let availableImages = [];
  let currentPairs = TOTAL_PAIRS;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function formatTime(ms) {
    const total = Math.floor(ms / 1000);
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ":" + String(s).padStart(2, "0");
  }

  function startTimer() {
    stopTimer();
    startTime = Date.now();
    timerId = setInterval(() => {
      timeEl.textContent = formatTime(Date.now() - startTime);
    }, 500);
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  async function loadImages() {
    try {
      const resp = await fetch(API_IMAGES + "?t=" + Date.now());
      if (!resp.ok) return [];
      const data = await resp.json();
      const files = data.Files || [];
      return files.map(f => (typeof f === "string" ? f : f.Name))
        .filter(name => /\.(jpe?g|png|gif|webp|svg|bmp)$/i.test(name));
    } catch (e) {
      return [];
    }
  }

  function showMessage(text) {
    board.innerHTML =
      '<div style="grid-column:1 / -1;text-align:center;font-size:18px;padding:40px;color:#fff;">' +
      text + '</div>';
  }

  function createCard(item, index) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.value = item;
    card.dataset.index = index;
    card.innerHTML =
      '<div class="inner">' +
        '<div class="back">?</div>' +
        '<div class="front"><img src="' + IMG_DIR + item + '?t=' + Date.now() + '" alt=""></div>' +
      '</div>';
    card.addEventListener("click", () => onCardClick(card));
    return card;
  }

  function onCardClick(card) {
    if (lockBoard) return;
    if (card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");

    if (!firstCard) {
      firstCard = card;
      return;
    }

    // 2枚目
    turns++;
    turnsEl.textContent = turns;

    if (firstCard.dataset.value === card.dataset.value) {
      firstCard.classList.add("matched");
      card.classList.add("matched");
      firstCard = null;
      matches++;
      matchesEl.textContent = matches + " / " + currentPairs;
      if (matches === currentPairs) endGame();
    } else {
      lockBoard = true;
      const a = firstCard, b = card;
      firstCard = null;
      setTimeout(() => {
        a.classList.remove("flipped");
        b.classList.remove("flipped");
        lockBoard = false;
      }, 800);
    }
  }

  function endGame() {
    stopTimer();
    const elapsed = Date.now() - startTime;
    resultEl.textContent = turns + "ターン / " + formatTime(elapsed) + "でクリアしました！";
    setTimeout(() => overlay.classList.add("show"), 600);
  }

  function newGame() {
    overlay.classList.remove("show");
    board.innerHTML = "";
    firstCard = null;
    lockBoard = false;
    turns = 0;
    matches = 0;
    turnsEl.textContent = "0";
    matchesEl.textContent = "0 / " + currentPairs;
    timeEl.textContent = "0:00";

    if (availableImages.length === 0) {
      showMessage("Imagesフォルダに画像が見つかりません。");
      return;
    }

    currentPairs = Math.min(TOTAL_PAIRS, availableImages.length);
    matchesEl.textContent = "0 / " + currentPairs;

    // 使用画像からランダム選択（毎回異なる組み合わせ）
    const names = shuffle(availableImages).slice(0, currentPairs);

    let deck = [];
    for (const name of names) {
      deck.push(name);
      deck.push(name);
    }
    deck = shuffle(deck);

    deck.forEach((name, index) => {
      board.appendChild(createCard(name, index));
    });

    startTimer();
  }

  async function init() {
    const images = await loadImages();
    availableImages = images;
    if (availableImages.length === 0) {
      showMessage("Imagesフォルダに画像が見つかりません。サーバーを起動して再度読み込んでください。");
      return;
    }
    newGame();
  }

  document.getElementById("restart").addEventListener("click", () => {
    overlay.classList.remove("show");
    newGame();
  });
  document.getElementById("restart2").addEventListener("click", () => {
    newGame();
  });

  init();
})();
</script>
</body>
</html>
